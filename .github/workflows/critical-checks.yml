name: InnerU release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      loading_only:
        description: Run only syntax and loading checks for diagnosis
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  critical-checks:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.loading_only && 'Loading diagnostics' || 'Critical checks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare failure artifacts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/inneru-release-artifacts/setup"
          echo "INNERU_TEST_ARTIFACT_DIR=$RUNNER_TEMP/inneru-release-artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _dev-tools/requirements-test.txt
      - name: Install test Python dependencies
        id: python_dependencies
        shell: bash
        run: |
          python -m pip install -r _dev-tools/requirements-test.txt 2>&1 | tee "$INNERU_TEST_ARTIFACT_DIR/setup/python-packages.log"
      - name: Install Playwright Chromium and Linux dependencies
        id: browser_setup
        shell: bash
        run: |
          python -m playwright install --with-deps chromium 2>&1 | tee "$INNERU_TEST_ARTIFACT_DIR/setup/chromium-install.log"
      - name: Report setup failure details
        if: failure() && (steps.python_dependencies.outcome == 'failure' || steps.browser_setup.outcome == 'failure')
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for log in (Path(os.environ['INNERU_TEST_ARTIFACT_DIR']) / 'setup').glob('*.log'):
              text = '\n'.join(log.read_text(errors='replace').splitlines()[-35:])
              message = (log.name + '\n' + text).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Release setup failed::' + message)
          PY
      - name: Check tracked JavaScript syntax
        run: git ls-files -z '*.js' | xargs -0 -n 1 node --check
      - name: Run critical suite sequentially
        if: github.event_name != 'workflow_dispatch' || !inputs.loading_only
        env:
          INNERU_TEST_ARTIFACT_DIR: ${{ runner.temp }}/inneru-release-artifacts
        run: npm test
      - name: Check cold loading budget, routes and offline caching
        env:
          INNERU_TEST_ARTIFACT_DIR: ${{ runner.temp }}/inneru-release-artifacts/performance
        run: |
          mkdir -p "$INNERU_TEST_ARTIFACT_DIR"
          log="$INNERU_TEST_ARTIFACT_DIR/console.log"
          if npm run test:performance > "$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            python - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['INNERU_TEST_ARTIFACT_DIR']) / 'console.log'
          message = '\n'.join(log.read_text(errors='replace').splitlines()[-25:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Loading check failed::' + message)
          PY
            exit 1
          fi
      - name: Upload failure logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: inneru-critical-check-failures
          path: ${{ runner.temp }}/inneru-release-artifacts
          if-no-files-found: ignore
          retention-days: 7
